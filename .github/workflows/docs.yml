name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.81.0

      - name: Copy README to docs index
        # The README is the documentation site home page. It is copied into
        # docs/ as a build artifact (docs/index.md is gitignored) so the source
        # README is never modified.
        run: cp README.md docs/index.md

      - name: Rewrite README links for the docs site
        # Operates only on the generated copy (docs/index.md), never the source
        # README, so repo-relative links keep working for GitHub browsing.
        #  - docs/<guide>.md -> <guide>.md  (guides render flat in the site;
        #    docfx rewrites .md -> .html and preserves #anchors)
        #  - .github/* and LICENSE -> absolute GitHub URLs (these are repo-meta
        #    files that are not rendered into the site)
        run: |
          sed -i \
            -e 's|](docs/|](|g' \
            -e 's|](.github/|](https://github.com/tsmarvin/BridgeBeats/blob/develop/.github/|g' \
            -e 's|](LICENSE)|](https://github.com/tsmarvin/BridgeBeats/blob/develop/LICENSE)|g' \
            docs/index.md

      - name: Build documentation
        run: docfx docs/docfx.json

      - name: Add .nojekyll file
        run: touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
